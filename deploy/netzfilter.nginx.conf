# Public static Netzfilter-Labor page; served from the isolated TinyPages LXC.
server {
    listen 80;
    listen [::]:80;
    server_name netzfilter.wfech.de;

    root /srv/pages/netzfilter-labor;
    index index.html;
    include /etc/nginx/snippets/netzfilter-labor-common.conf;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:map|bak|swp|tmp|orig)$ {
        deny all;
    }
}
