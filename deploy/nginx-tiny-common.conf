# Shared hardening for tiny-pages vhosts. Included from each server block.
# Inherited by locations that do not define their own add_header.
server_tokens off;
autoindex off;
charset utf-8;
expires -1;
client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 15s;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
