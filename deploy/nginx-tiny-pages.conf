# Tiny static pages behind Traefik. GET/HEAD only, no listing, no server-side code.
# One server block per public hostname; new pages get their own block + Traefik router.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/pages;
    index index.html;
    include /etc/nginx/snippets/tiny-common.conf;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:map|bak|swp|tmp|orig)$ {
        deny all;
    }
}

