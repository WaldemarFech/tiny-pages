<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Modelle & Rangliste</title>
  <link rel="stylesheet" href="../router.css?v=20261102d">
</head>
<body class="page-modelle">
<header class="top">
  <div class="brand">
    <div class="kicker" id="modelName">OpenRouter · Modelle</div>
    <h1>Modelle & Rangliste</h1>
  </div>
  <nav class="seg" aria-label="Seiten">
    <a href="../">Router</a>
    <a href="./" aria-current="page">Modelle</a>
    <a href="../preis-uhr/">Preis-Uhr</a>
  </nav>
  <div class="orl" aria-label="Bei OpenRouter öffnen">
    <a class="ext" id="orModel" href="https://openrouter.ai/rankings" target="_blank" rel="noopener noreferrer" aria-label="Rankings bei OpenRouter (öffnet in neuem Tab)">Rankings <svg class="ext-ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M9 2h5v5M14 2 7.5 8.5M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
  <div class="fresh" id="fresh" role="status">Lade Daten …</div>
</header>

<div class="alert glow" id="alertBar" role="status" hidden></div>
<main id="app">
  <section class="card" id="market" aria-labelledby="h-market">
    <div class="sec-head"><h2 id="h-market">OpenRouter-Rangliste</h2><button class="i" data-explain="picks" aria-label="Erklärung: Rangliste und Top 3">i</button></div>
    <div id="marketBody" class="loading">Lade …</div>
  </section>

  <section class="card" id="freeModels" aria-labelledby="h-free">
    <div class="sec-head"><h2 id="h-free">Kostenlose Modelle</h2></div>
    <p class="lead">Alle Modelle mit 0 $ Input und Output. <span class="tg stealth">Stealth</span> = kostenlos, aber nicht als „free“ gekennzeichnet. Ein neues Stealth-Modell leuchtet orange.</p>
    <div id="freeBody"></div>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" class="dlg-in">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <button class="btn" value="close" autofocus>Schließen</button>
  </form>
</dialog>

<script type="module" src="./modelle.js?v=20261102d"></script></body>
</html>
